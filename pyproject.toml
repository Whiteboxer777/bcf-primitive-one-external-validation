[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bcf-primitive-one"
version = "1.0.0"
description = "Deterministic fail-closed admission boundary primitive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "jsonschema>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bcf-primitive = "bcf_primitive.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = ["-p", "no:cacheprovider"]
